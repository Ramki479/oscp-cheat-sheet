name: CI

on: push

jobs:
  build-validate-test:
    name: Build, validate, test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          # Depth 2 so the cache check can diff the pushed commit against its parent.
          fetch-depth: 2

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The browser suite launches a real Chromium; the runner image does not
      # ship one at the path the tests look for, so provide it explicitly.
      - name: Provide Chromium
        id: chrome
        uses: browser-actions/setup-chrome@v1
        with:
          install-chromedriver: false

      - name: Rebuild the dataset from content/raw
        run: npm run build

      # A rebuilt dataset shipped under an unchanged cache name leaves returning
      # visitors on stale commands. Diff the pushed commit against its parent rather
      # than trusting a README rule.
      - name: Check the service worker cache version
        run: npm run check:cache -- HEAD^

      - name: Validate the data contract
        run: npm run validate

      - name: Test (engine, data, bundle, regression, browser)
        run: npm test
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
